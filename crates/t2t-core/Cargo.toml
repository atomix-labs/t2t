[package]
name                   = "t2t-core"
description            = "time values: points on the wall and monotonic clocks, counter readings, and the spans between them."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords               = ["time", "timestamp", "duration", "rfc3339", "no-std"]
categories             = ["date-and-time", "no-std", "no-std::no-alloc"]
exclude                = ["benches/results/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets      = ["x86_64-unknown-linux-gnu"]

[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs"]

[features]
default = []

chrono-04 = ["dep:chrono"]
jiff-02 = ["dep:jiff"]
schemars = ["dep:schemars", "serde"]
serde = ["dep:serde_core"]
std = [
    "arrayvec/std",
    "chrono?/std",
    "derive_more/std",
    "jiff?/std",
    "powerfmt/std",
    "schemars?/std",
    "serde_core?/std",
    "time?/std",
    "zerocopy?/std",
]
time-03 = ["dep:time"]
zerocopy-08 = ["dep:zerocopy"]

[lints]
workspace = true

[lib]
bench = false

[[bench]]
name    = "convert"
harness = false

[dependencies]
# external
arrayvec    = { workspace = true }
chrono      = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["debug", "deref", "deref_mut", "display", "error", "from", "into"] }
itoa        = { workspace = true }
jiff        = { workspace = true, optional = true }
powerfmt    = { workspace = true }
schemars    = { workspace = true, optional = true }
serde_core  = { workspace = true, optional = true }
time        = { workspace = true, optional = true }
zerocopy    = { workspace = true, optional = true }

[dev-dependencies]
# external
divan       = { workspace = true }
fancy-regex = { workspace = true }
proptest    = { workspace = true }
rstest      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_test  = { workspace = true }
trybuild    = { workspace = true }

run-id  = "2026-10-03T10-21Z-8aeae1f-clock-reads"
purpose = "what one reading of each clock costs: the OS clocks through clock_gettime, and the CPU's counter"

[hardware]
cpu        = "AWS Graviton4 (Arm Neoverse V2), c8g.8xlarge"
cores      = 32
cache-line = 64

[environment]
kernel        = "Linux 6.12.53-69.119.amzn2023.aarch64"
clocksource   = "arch_sys_counter"
counter-rate  = "1000000000 Hz, from cntfrq_el0"
isolated-cpus = "6-31"
placement     = "taskset -c 10"

[toolchain]
rustc   = "1.101.0-nightly (d080e7dff 2026-09-27)"
profile = "bench: release's settings, fat LTO, one codegen unit, built to unwind"
flags   = "the workspace's floor, +crc"

[parameters]
command = "taskset -c 10 cargo bench -p t2t-clock --features std --bench read, built first with --no-run"
threads = "1, 2, 4 and 8, every thread on core 10, so the counts share one core and show no contention between cores"
timer   = "divan's, 29 to 30 ns precise, each sample a batch of reads, so a read below the timer's precision is still timed"
samples = 100

[results.median-ns-per-read]

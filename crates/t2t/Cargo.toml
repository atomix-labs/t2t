[package]
name                   = "t2t"
description            = "time values and the clocks that read them, for code where a nanosecond counts."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme                 = "../../README.md"
keywords               = ["time", "clock", "timestamp", "tsc", "low-latency"]
categories             = ["date-and-time", "no-std", "hardware-support"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[features]
default = []

chrono-04   = ["t2t-core/chrono-04"]
jiff-02     = ["t2t-core/jiff-02"]
schemars    = ["serde", "t2t-core/schemars"]
serde       = ["t2t-core/serde"]
std         = ["t2t-clock/std", "t2t-core/std"]
time-03     = ["t2t-core/time-03"]
zerocopy-08 = ["t2t-core/zerocopy-08"]

[lints]
workspace = true

[[example]]
name              = "clock-tour"
required-features = ["std"]

[dependencies]
# internal
t2t-clock = { workspace = true }
t2t-core  = { workspace = true }
